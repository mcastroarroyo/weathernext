# GDE-Nino (Ecuador El Nino Digital Twin) - source registry
# Human-readable companion: docs/05-data-catalog.md (tables use the same ids).
# CI checks: unique ids, allowed enum values, licence metadata complete (FR-019),
# every `job` defined in infra/commons/, nc/pending_review never published to commons_pub (G-02),
# and a currency warning when `last_checked` is null or older than 90 days (30 days for P1 sources
# that are not static).
# All .gob.ec / .mil.ec endpoints are secondary-verified only (third-party live probes Aug-Sep 2026);
# re-probe from southamerica-west1 in Phase 0 (milestone M0.3, 2026-10-09) before relying on them.

version: "1.1.0"
updated: "2026-09-30"

fields_doc:
  id: "Unique snake_case key; referenced by docs/05-data-catalog.md, layer_registry.source_ids and commons_ops tables."
  name: "Human-readable dataset name."
  provider: "Institution or organisation that publishes the data."
  category: "official_alerts | enso_ocean | atmosphere_obs | forecast | hydrology | terrain_hydrography | exposure | vulnerability | impacts | health | admin_boundaries | basemap"
  url_or_id: "Exact endpoint, bucket path, Earth Engine asset id, BigQuery table or dataset id. Patterns use {placeholders}."
  access_method: "Protocol and client (REST JSON, WFS, EE, BigQuery, GCS Zarr, cdsapi, PDF, etc.) plus auth notes."
  spatial_resolution: "Grid spacing, feature type or administrative level."
  temporal_resolution: "Time step of the data."
  latency: "Delay between valid time and availability, as known."
  update_cadence: "How often the source updates, and how often we poll it."
  licence: "Licence name and key terms, as stated by the provider (or 'none published')."
  licence_class: "Gating class (docs/05 section 5.1): open | sa | nc | wn_nrva | wn_historic_ccby | official_verbatim | agreement | pending_review. Unknown is gated as nc."
  attribution: "Attribution line to show on maps and ship in LICENSES.txt."
  commercial_use: "\"yes\" | \"no\" | \"unclear\" (unclear is gated as non-commercial until legal clears it)."
  plane: "commons | tenant | both (both = Commons builds national products and tenants also query in place)."
  ingestion: "pull | query_in_place | push | manual."
  priority: "P1 (MVP) | P2 (peak-season operations) | P3 (later/optional)."
  phase: "0-4 per design spine section 7 (0 Mobilise, 1 MVP, 2 Peak season, 3 Learn and extend, 4 Institutionalise)."
  verified: "true = identifier/endpoint confirmed in the research briefs (primary catalogue/bucket read or third-party live probe Aug-Sep 2026); false = prior knowledge or not confirmed."
  vintage: "Release, version or data date currently in hand (e.g. 'CPV 2022', 'Global2 R2025A v1', 'v3 (inference May 2023)', 'GHSL P2023A'). 'live feed' / 'live ...' marks sources with no versioned release; their freshness is tracked per poll in commons_ops.source_health. 'not held' = no copy yet (agreement pending)."
  last_checked: "ISO date (YYYY-MM-DD) the endpoint and vintage were last confirmed current, or null if never confirmed. 2026-09-29 = research-brief check; for .gob.ec/.mil.ec entries that date rests on third-party probe records, and the M0.3 re-probe overwrites it. CI warns when null or older than 90 days (30 days for P1 sources that are not static). Updated at the quarterly source-currency review (docs/11 section 12.3; exposure layers 'reviewed quarterly' per docs/02 section 6.2) and whenever a job detects a new release."
  job: "Optional. Commons job that ingests or builds from this source (names from docs/03 section 7.2 and docs/11 section 2.1, or new ones listed in docs/05 section 4.4)."
  region: "Optional. GCP region where the job runs (southamerica-west1 for .gob.ec; us-central1 otherwise; us-east1 for WN3 members)."
  owner: "Optional. Role code: DL, FL, PL, FE, AI, SRE, DPO, PM, PA."
  allowed_hosts: "Optional. Hosts the ingest job may contact or be redirected to (docs/11 RB-07)."
  tls_quirks: "Optional. Known TLS/transport issues and the approved handling (never verify=False for official sources)."
  rename_history: "Optional. Previous hosts/institution names."
  notes: "Free text: caveats, known issues, tables written."

sources:

