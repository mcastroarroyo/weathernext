server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/html application/javascript text/css application/json application/geo+json text/csv;
  # GIS exports: readable from ArcGIS Online and other web GIS (CORS), GeoJSON with its media type
  location /data/ {
    types { application/geo+json geojson; application/json json; text/csv csv; application/zip zip; text/plain txt; }
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "no-cache";
  }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
