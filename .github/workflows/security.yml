name: security

# Dependency audit (pip-audit, PyPI advisory + OSV databases) on every change and weekly,
# and a passive OWASP ZAP baseline scan of the deployed twin weekly (no attacks, no load).
on:
  push:
    paths: ["**/requirements*.txt", "**/pyproject.toml", "**/Dockerfile", ".github/workflows/security.yml"]
  pull_request:
  schedule:
    - cron: "0 11 * * 1"          # Mondays 11:00 UTC (06:00 Ecuador)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [demo/twin/deploy/requirements.txt, demo/twin/pipeline/requirements.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit ${{ matrix.target }}
        run: pip-audit --requirement "${{ matrix.target }}" --vulnerability-service osv --desc on

  zap-baseline:
    name: ZAP baseline (passive)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check target
        id: t
        env: {TARGET: "${{ secrets.ZAP_TARGET_URL }}"}
        run: echo "ok=$([ -n "$TARGET" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: zaproxy/action-baseline@v0.15.0
        if: steps.t.outputs.ok == 'true'
        with:
          target: ${{ secrets.ZAP_TARGET_URL }}
          allow_issue_writing: false          # public repo: findings are not published as issues
          fail_action: false
          artifact_name: zap-baseline
