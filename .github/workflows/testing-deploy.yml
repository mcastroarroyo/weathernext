name: testing-deploy

# Deploys infra/testing into the GDE-Niño TEST project with Workload Identity
# Federation. Needs three repository SECRETS created by
# scripts/testing/bootstrap-ci-wif.sh: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_CI_SA.
# Push: plan only. Manual run: plan and (by default) apply.

on:
  push:
    paths:
      - "infra/testing/**"
      - ".github/workflows/testing-deploy.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: testing-deploy
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          P: ${{ secrets.GCP_PROJECT_ID }}
          W: ${{ secrets.GCP_WIF_PROVIDER }}
          S: ${{ secrets.GCP_CI_SA }}
        run: |
          if [ -n "$P" ] && [ -n "$W" ] && [ -n "$S" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::GCP secrets not set yet; run scripts/testing/bootstrap-ci-wif.sh"; fi

  deploy:
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/testing
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: init
        run: terraform init -input=false -backend-config="bucket=${TF_VAR_project_id}-ectwin-tfstate"
      - name: plan
        run: terraform plan -input=false -out=tfplan
      - name: apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false -auto-approve tfplan
